name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP="LUNARVOIDSMP-0.6.2-test-GitHub-Project.zip"
          test -f "$ZIP"
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          ROOT="/tmp/project"
          if [ -f "$ROOT/pom.xml" ]; then
            :
          else
            FOUND="$(find "$ROOT" -mindepth 2 -maxdepth 3 -name pom.xml -print -quit)"
            test -n "$FOUND"
            ROOT="$(dirname "$FOUND")"
          fi
          cp -a "$ROOT"/. .
          rm -f "$ZIP"
          git status --short

      - name: Commit extracted project files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The GitHub Actions token cannot create workflow files without the separate workflows permission.
          # Keep the build workflow out of this extraction commit; add it separately afterward.
          rm -f .github/workflows/build.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract plugin project from ZIP"
            git push
          fi
